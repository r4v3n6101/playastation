[package]
name = "playastation-web"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
playastation = { path = "../core" }
playastation-frontend-common = { path = "../frontend-common", features = ["web"] }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "Worker",
  "MessageEvent",
  "console",
] }
