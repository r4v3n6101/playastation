[package]
name = "playastation"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A PlayStation emulator core written in Rust"
readme = "README.md"
keywords = ["playstation", "psx", "emulator", "gaming"]
categories = ["emulators"]

[dependencies]
# Traces
tracing = { version = "0.1.44", default-features = false, features = ["attributes"] }

# Boilerplate codegen macros
derive_more = { version = "2.1.1", default-features = false, features = ["debug"] }
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
bitflags = { version = "2.11.0", default-features = false }
modular-bitfield = "0.13.1"
snafu = { version = "0.9.2", default-features = false, features = ["rust_1_81"] }

# Optimization of allocations
smallvec = { version = "1.15.1", default-features = false }
smallbox = { version = "0.8.8", default-features = false, features = ["coerce"] }

# File formats
peg = { version = "0.8.6", default-features = false }
yoke = { version = "0.8.2", default-features = false, features = ["alloc"] }
zerocopy = { version = "0.8.48", default-features = false, features = ["alloc"] }
zerocopy-derive = "0.8.48"

# Software rendering
euclid = { version = "0.22.14", default-features = false }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "cpu"
harness = false

[[bench]]
name = "cpu_memory"
harness = false
